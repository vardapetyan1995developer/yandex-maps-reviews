services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: yr-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # The queue worker is a separate service: parsing runs in the background and
  # must not share a process with HTTP handling. Scale it with --scale.
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: yr-queue
    restart: unless-stopped
    working_dir: /var/www
    # The worker waits for the application to be ready rather than crash-looping.
    # Setup runs after `up` (see the README), so on a first launch neither
    # vendor/ nor the schema exists yet. `migrate:status` is the gate because it
    # fails on every one of those conditions — no dependencies, no app key, no
    # database connection, no migrations table — and succeeds only once the
    # application can genuinely run.
    command: >
      sh -c "until [ -f /var/www/vendor/autoload.php ] && php artisan migrate:status >/dev/null 2>&1; do
               echo 'waiting for application setup (composer install + migrate)...'; sleep 3;
             done;
             echo 'application ready, starting worker';
             php artisan queue:work --tries=3 --timeout=600 --sleep=3 --max-jobs=200"
    volumes:
      - .:/var/www
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: yr-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: yr-mysql
    restart: unless-stopped
    # Published only so a GUI client can reach the database from the host; the
    # application connects over the compose network. High port numbers keep a
    # MySQL already running on the host from breaking `docker compose up`.
    ports:
      - "${DB_FORWARD_PORT:-13306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-yandex_reviews}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    volumes:
      - mysql-data:/var/lib/mysql
    # The application only starts once the database is genuinely ready to
    # accept connections, not merely once its container is up
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: yr-redis
    restart: unless-stopped
    ports:
      - "${REDIS_FORWARD_PORT:-16379}:6379"

volumes:
  mysql-data:
