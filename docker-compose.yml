services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: yr-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # The queue worker is a separate service: parsing runs in the background and
  # must not share a process with HTTP handling. Scale it with --scale.
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: yr-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --tries=3 --timeout=600 --sleep=3 --max-jobs=200
    volumes:
      - .:/var/www
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: yr-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: yr-mysql
    restart: unless-stopped
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-yandex_reviews}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    volumes:
      - mysql-data:/var/lib/mysql
    # The application only starts once the database is genuinely ready to
    # accept connections, not merely once its container is up
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: yr-redis
    restart: unless-stopped
    ports:
      - "${REDIS_FORWARD_PORT:-6380}:6379"

volumes:
  mysql-data:
