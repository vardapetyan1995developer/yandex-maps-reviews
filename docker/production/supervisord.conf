; Runs the three processes that make up the container.
;
; Splitting the web tier and the worker across separate containers is the better
; arrangement, and the development compose file does exactly that. Render's free
; plan has no background workers, so they are combined here; the trade-off is
; stated in the README rather than hidden.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
; --max-time recycles the worker hourly so a long-lived process cannot
; accumulate memory; supervisor restarts it immediately.
; --tries and --timeout mirror the job's own settings.
command=php /var/www/artisan queue:work --tries=3 --timeout=600 --sleep=3 --max-time=3600
directory=/var/www
user=www-data
; supervisor drops privileges with `user=` but leaves HOME pointing at /root.
; libpq then looks for an optional client certificate under /root/.postgresql
; and aborts the whole connection on "Permission denied" rather than treating
; the file as absent. Giving the process a HOME it can actually read makes the
; lookup miss cleanly, which is what libpq expects.
environment=HOME="/var/www"

autostart=true
autorestart=true
priority=20
stopwaitsecs=610
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
