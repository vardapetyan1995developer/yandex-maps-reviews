# Render Blueprint — describes the whole deployment so it can be recreated from
# the repository rather than assembled by hand in a dashboard.
#
# Apply it with: Render dashboard -> New -> Blueprint -> pick this repository.

# No `databases:` block on purpose.
#
# Render allows a single free-tier database per account, so declaring one here
# fails outright on any account that already has one — and takes the web service
# down with it, since the blueprint applies atomically. The database is therefore
# supplied externally through DB_URL, which also sidesteps the expiry Render
# applies to free instances.
#
# Any managed PostgreSQL works. Neon (neon.tech) has a free tier that does not
# expire and wakes in well under a second, which suits a service that sleeps
# when idle.

services:
  - type: web
    name: yandex-maps-reviews
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./docker/production/Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeploy: true

    envVars:
      # Laravel requires a very specific shape here: the literal prefix
      # "base64:" followed by exactly 32 base64-encoded bytes. Render's
      # generateValue produces a random alphanumeric string, which passes
      # silently through deployment and then fails at the first encrypted
      # cookie with "Unsupported cipher or incorrect key length" — a message
      # that points at the cipher rather than at the key that is actually wrong.
      #
      # So it is prompted for instead. Generate one with `php artisan key:generate
      # --show` and paste it in; keep it stable, because rotating the key
      # invalidates every existing session and encrypted value.
      - key: APP_KEY
        sync: false

      - key: APP_NAME
        value: Yandex Reviews
      - key: APP_ENV
        value: production
      # Never true in production: the debug page prints environment variables,
      # including database credentials
      - key: APP_DEBUG
        value: false
      - key: APP_LOCALE
        value: ru
      - key: LOG_CHANNEL
        value: stderr

      # Connection string for an external PostgreSQL instance.
      #
      # The variable is DB_URL, not DATABASE_URL: Laravel's database config
      # reads `env('DB_URL')`, so a differently named variable is silently
      # ignored and the app falls back to 127.0.0.1 — a failure that looks like
      # a network problem rather than a configuration one.
      #
      # sync: false means Render prompts for the value instead of taking it from
      # this file, which keeps the credentials out of the repository.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      # Managed providers require TLS; the Laravel default of `prefer` would
      # silently accept an unencrypted connection where one was offered
      - key: DB_SSLMODE
        value: require

      # The queue runs inside this same container (see supervisord.conf), so it
      # needs a driver both processes can see. The database is the only shared
      # store on the free plan.
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      # null binds the session cookie to whatever host serves the request, which
      # is what makes it work on an onrender.com subdomain without further edits
      - key: SESSION_DOMAIN
        value: null

      # Sanctum only issues a session cookie to origins listed here. Replace the
      # placeholder with the real hostname after the first deploy, or login will
      # fail with a 419 and no other explanation.
      - key: SANCTUM_STATEFUL_DOMAINS
        value: yandex-maps-reviews.onrender.com

      - key: SEED_USER_NAME
        value: Демо-пользователь
      - key: SEED_USER_EMAIL
        value: demo@example.com
      # Override in the dashboard if the instance should not use the documented
      # demo password
      - key: SEED_USER_PASSWORD
        value: password

      # Scraping behaviour. The delay range is wider than the local default:
      # requests leave a datacentre IP, which Yandex challenges more readily.
      - key: SCRAPING_DELAY_MIN_MS
        value: 800
      - key: SCRAPING_DELAY_MAX_MS
        value: 2000
      - key: SCRAPING_YANDEX_MAX_REVIEWS
        value: 600
      - key: SCRAPING_HEADLESS_ENABLED
        value: false
